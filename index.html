<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f6f5ef;--card:#fffefb;--g:#1f4d3f;--gl:#e3ebe0;--tx:#17352c;--mut:#6b7a73;--bd:#e7e5db}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Lato,system-ui,sans-serif;font-size:15px}
.app{max-width:430px;margin:0 auto;padding:12px 18px 120px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:900;letter-spacing:.05em;color:var(--g)}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;color:var(--g);cursor:pointer;padding:0}
h1{font-size:28px;font-weight:900;margin:6px 0 2px;color:var(--g)}
.sub{color:var(--mut);font-size:13px}
.hero{background:#1f4d3f;color:#fff;border-radius:20px;padding:18px;margin:16px 0 12px}
.hero .l{font-size:13px;opacity:.85;display:flex;justify-content:space-between}
.hero .a{font-size:42px;font-weight:900;display:flex;align-items:baseline;gap:8px;margin:6px 0}.hero small{font-size:15px;font-weight:700;opacity:.85}
.two{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #ffffff30;margin-top:10px;padding-top:12px;font-size:12px}.two b{display:block;font-size:16px;margin-top:2px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:15px;font:inherit;font-weight:900;display:flex;gap:8px;justify-content:center;align-items:center;cursor:pointer;width:100%}
.d{background:#1f4d3f;color:#fff}.lt{background:var(--gl);color:var(--g)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px}.sec h2{font-size:19px;margin:0;font-weight:900;color:var(--g)}.sec a{font-weight:900;font-size:13px;color:var(--g);cursor:pointer}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 0 0 1px var(--bd);cursor:pointer}
.irow{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}
.ico{width:44px;height:44px;border-radius:12px;background:var(--gl);display:grid;place-items:center;color:var(--g);flex:none}
.nm{font-weight:900;color:var(--g)}.pr{font-weight:700;font-size:14px;margin:2px 0}.meta{font-size:11px;color:var(--mut)}
.chip{font-size:11px;font-weight:900;padding:3px 9px;border-radius:6px;white-space:nowrap}
.r{background:#f8dfdb;color:#b4372b}.a{background:#f4e6cf;color:#8a5a12}.g{background:#dfeadd;color:#2c6a4f}.n{background:var(--gl);color:var(--mut)}
.note{font-size:11px;color:var(--mut);margin:8px 2px}
.soft{background:var(--gl);border-radius:16px;padding:16px;margin:12px 0}
.bar{height:6px;background:#fffefb;border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:#1f4d3f}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:24px;font-weight:900;color:var(--g)}
.seg{display:flex;background:var(--gl);border-radius:12px;padding:4px;margin:10px 0}
.seg button{flex:1;border:0;background:none;padding:11px 4px;border-radius:9px;font:inherit;font-weight:900;color:var(--mut);cursor:pointer;display:flex;gap:6px;justify-content:center;align-items:center}
.seg .on{background:var(--card);color:var(--g)}.seg .on.d{background:#1f4d3f;color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0;padding-bottom:2px}.chips button{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 14px;font:inherit;font-weight:700;font-size:13px;color:var(--g);white-space:nowrap}.chips .on{background:#1f4d3f;color:#fff;border-color:#1f4d3f}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px;width:100%;margin-bottom:10px}
label{font-weight:900;color:var(--g);font-size:14px;display:block;margin:6px 0}
.amt{display:flex;align-items:baseline;gap:8px;font-weight:900}.amt span{color:var(--mut);font-size:16px}.amt input{font-size:36px;font-weight:900;border:0;padding:0;margin:0;background:none;color:var(--g)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.mc{border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:12px;display:flex;gap:8px;align-items:center;font-weight:900;color:var(--g);cursor:pointer}.mc.on{background:var(--gl);border:1.5px solid #1f4d3f}
.lt2{width:28px;height:28px;border-radius:8px;background:var(--gl);display:grid;place-items:center;font-weight:900;font-size:13px}.on .lt2{background:#1f4d3f;color:#fff}
.sm{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}.sm b{color:var(--g)}
.tx{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--bd);cursor:pointer}.tx:first-child{border-top:0}
.tx .ico{width:36px;height:36px;border-radius:10px}
.rt{text-align:right}.rt b{display:block;color:var(--g)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:430px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font:inherit;font-size:11px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button i{padding:5px 18px;border-radius:99px;display:grid}nav .on{color:var(--g);font-weight:900}nav .on i{background:var(--gl)}
.lk{background:none;border:0;color:var(--mut);font:inherit;font-size:11px;text-decoration:underline;cursor:pointer}
</style></head><body><div class="app" id="app"></div><nav id="nav"></nav>
<script>
const K="pangono_v1",$=i=>document.getElementById(i);
const P={home:"M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10",bag:"M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z M3 6h18 M16 10a4 4 0 0 1-8 0",wallet:"M20 12V8H6a2 2 0 0 1 0-4h12v4 M4 6v12a2 2 0 0 0 2 2h14v-4 M18 12a2 2 0 0 0 0 4h4v-4z",clock:"M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z M12 6v6l4 2",bell:"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9 M13.7 21a2 2 0 0 1-3.4 0",plus:"M12 5v14M5 12h14",chev:"M9 18l6-6-6-6",left:"M15 18l-6-6 6-6",down:"M6 9l6 6 6-6",back:"M19 12H5M12 19l-7-7 7-7",edit:"M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z",search:"M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16z M21 21l-4.3-4.3",sprout:"M12 22V12 M12 12C12 8 9 5 4 5c0 4 3 7 8 7 M12 14c0-3 3-6 8-6 0 4-3 6-8 6",inc:"M17 7L7 17 M17 17H7V7",exp:"M7 17L17 7 M7 7h10v10",cal:"M4 4h16v17H4z M16 2v4 M8 2v4 M4 10h16",shield:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z M9 12l2 2 4-4",check:"M20 6L9 17l-5-5",x:"M18 6L6 18M6 6l12 12",coin:"M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z M14.5 9h-3a1.5 1.5 0 0 0 0 3h1a1.5 1.5 0 0 1 0 3H9.5 M12 7v10",Food:"M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z M2 21c0-3 1.9-5.5 6-8",Shoes:"M2 17h20v3H2z M4 17V9l5 3 3-2h4c3 0 4 3 4 7",Technologies:"M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z M12 18h.01",Other:"M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M12 1v2 M12 21v2 M4.2 4.2l1.4 1.4 M18.4 18.4l1.4 1.4 M1 12h2 M21 12h2 M4.2 19.8l1.4-1.4 M18.4 5.6l1.4-1.4",Clothes:"M20.4 6.5L16 3a4 4 0 0 1-8 0L3.6 6.5 2 11l4 1v9h12v-9l4-1z",dl:"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3",sort:"M4 6h16M7 12h10M10 18h4",tr:"M17 1l4 4-4 4 M3 11V9a4 4 0 0 1 4-4h14 M7 23l-4-4 4-4 M21 13v2a4 4 0 0 1-4 4H3"};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;
const seed=()=>({name:"Thoko",goal:50000,open:0,items:[
{id:1,name:"Maize flour · 25 kg",sub:"Staple",cat:"Food",pri:"High",when:"Urgent",due:"2026-10-17",min:18000,max:22000},
{id:2,name:"School shoes",sub:"Child size",cat:"Shoes",pri:"High",when:"By next week",due:"2026-10-24",min:28000,max:38000},
{id:3,name:"Android smartphone",sub:"Entry-level · 64 GB storage",cat:"Technologies",pri:"Medium",when:"Within a month",due:"2026-11-17",min:140000,max:190000},
{id:4,name:"Solar starter kit",sub:"Home kit",cat:"Other",pri:"Medium",when:"Within 2 months",due:"2026-12-17",min:180000,max:240000},
{id:5,name:"Work shirt",sub:"Office wear",cat:"Clothes",pri:"Low",when:"Within a month",due:"2026-11-17",min:12000,max:18000}],
tx:[["saving",5000,"2026-10-17","Airtel Money","Daily savings"],["expense",15000,"2026-10-16","TNM Mpamba","Electricity"],["saving",5000,"2026-10-15","TNM Mpamba","Daily savings"],["expense",7000,"2026-10-14","Cash","Transport"],["income",40000,"2026-10-12","Cash","Side work"],["expense",18000,"2026-10-07","Airtel Money","Groceries"],["saving",15000,"2026-10-03","Airtel Money","Daily savings"],["expense",60000,"2026-10-02","Cash","Rent"],["income",240000,"2026-10-01","Bank","Salary"]].map((a,i)=>({id:100+i,type:a[0],amt:a[1],date:a[2],method:a[3],note:a[4]}))});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let V={t:"home"},fCat="All",fTx="All",q="",hm=new Date().toISOString().slice(0,7),D=null;
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],ML=["January","February","March","April","May","June","July","August","September","October","November","December"];
const iso=d=>d.toISOString().slice(0,10),today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const pd=s=>{const[a,b,c]=s.split("-");return new Date(a,b-1,c)};
const sh=s=>{const d=pd(s);return d.getDate()+" "+MON[d.getMonth()]},lg=s=>{const d=pd(s);return d.getDate()+" "+ML[d.getMonth()]+" "+d.getFullYear()};
const m=n=>"MWK "+Math.round(n).toLocaleString("en-US"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum=(t,f=()=>1)=>S.tx.filter(x=>x.type===t&&f(x)).reduce((a,b)=>a+b.amt,0);
const funds=(u)=>S.open+sum("income",x=>!u||x.date<=u)-sum("expense",x=>!u||x.date<=u),res=()=>sum("saving"),sp=()=>funds()-res();
const PR={High:0,Medium:1,Low:2},TF=["Urgent","By next week","Within a month","Within 2 months","Within 3 months"];
const dueOf=w=>{const d=new Date();if(w==="Urgent")return today();if(w==="By next week")d.setDate(d.getDate()+7);else d.setMonth(d.getMonth()+(w==="Within a month"?1:w==="Within 2 months"?2:3));return iso(new Date(d-d.getTimezoneOffset()*6e4))};
const st=i=>{const s=sp();return s>=i.max?["Full range affordable","g"]:s>=i.min?["Budget within range","a"]:["Outside budget","r"]};
const pc=p=>p==="High"?"r":p==="Medium"?"a":"g";
const dl=(i)=>`${i.when} · ${i.when==="Urgent"?"Today":sh(i.due)}`;
const go=(t,x)=>{V=Object.assign({t},x||{});scrollTo(0,0);render()};
const hdr=(r)=>`<div class="top"><div class="brand">${ic("sprout",18)}PANG’ONO / DEMO</div>${r}</div>`;
const hero=()=>`<div class="hero"><div class="l"><span>Available to spend</span>${ic("wallet",18)}</div><div class="a"><small>MWK</small>${Math.round(sp()).toLocaleString("en-US")}</div><div class="two"><div>Total funds<b>${m(funds())}</b></div><div>Reserved savings<b>${m(res())}</b></div></div></div>`;
const itemCard=(i)=>{const s=st(i);return `<div class="card" onclick="go('detail',{id:${i.id}})"><div class="irow"><div class="ico">${ic(i.cat)}</div><div class="grow"><div class="row"><span class="nm">${esc(i.name)}</span>${V.t==="list"?`<span class="chip ${pc(i.pri)}">${i.pri}</span>`:""}</div>${V.t==="list"?`<div class="meta">${i.cat}</div>`:""}<div class="pr">${m(i.min)}–${(i.max).toLocaleString("en-US")}</div><div class="row"><span class="meta">${dl(i)}${V.t==="list"?"":" · "+s[0]}</span>${V.t==="list"?`<span class="chip ${s[1]}">${s[0]}</span>`:""}</div></div>${V.t==="list"?"":ic("chev",16)}</div></div>`};
const txRow=(x)=>{const t=x.type,n=t==="saving"?"Savings transfer":t==="income"?"Income":"Expense",sg=t==="expense"?"− ":t==="income"?"+ ":"";return `<div class="tx" onclick="delTx(${x.id})"><div class="ico">${ic(t==="saving"?"coin":t==="income"?"inc":"exp",18)}</div><div class="grow"><b class="nm">${esc(x.note||n)}</b><div class="meta">${x.date===today()?"Today":sh(x.date)} · ${x.method}</div></div><div class="rt"><b>${sg}${m(x.amt)}</b><span class="meta">${n}</span></div></div>`};
function home(){const L=[...S.items].sort((a,b)=>PR[a.pri]-PR[b.pri]||a.due.localeCompare(b.due)),hi=S.items.filter(i=>i.pri==="High").length,ts=sum("saving",x=>x.date===today()),last=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)[0],pct=Math.min(100,res()/S.goal*100);
return hdr(`<button class="ib" onclick="alert('You’re all caught up.')">${ic("bell",18)}</button>`)+`<h1 onclick="const n=prompt('Your name',S.name);if(n){S.name=n;save();render()}">Hello, ${esc(S.name)}.</h1><div class="sub">${new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).replace(/^(\w+) /,"$1, ")}</div>`+hero()+`<div class="btns"><button class="btn d" onclick="openRec('saving')">${ic("plus",16)}Record money</button><button class="btn lt" onclick="go('add')">${ic("bag",18)}Add an item</button></div>
<div class="sec"><h2>Up next</h2><a onclick="go('list')">View list →</a></div>${hi?`<div class="row" style="justify-content:flex-start;margin-bottom:10px"><span class="chip r">${hi} High priority</span><span class="meta" style="font-size:12px">Start with what matters most.</span></div>`:""}${L.slice(0,2).map(itemCard).join("")||'<div class="note">Nothing planned yet.</div>'}<div class="note">Illustrative prices only. Confirm with a local seller.</div>
<div class="soft"><div style="font-size:13px">Little by little, it adds up.</div><div class="row"><span class="big">${m(ts)} today</span><span class="ico" style="background:#d6e8c4;border-radius:50%">${ic("sprout")}</span></div><div class="row meta" style="color:var(--g);font-weight:900;margin-top:8px"><span>Rainy-day fund</span><span>${Math.round(pct)}% of ${m(S.goal)}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
<div class="sec"><h2>Latest activity</h2><a onclick="go('hist')">History →</a></div>${last?txRow(last):'<div class="note">No activity yet.</div>'}<div class="note" style="text-align:center;margin-top:18px">Demo balances · Manual records · No accounts linked<br><button class="lk" onclick="if(confirm('Clear all data and start fresh?')){S={name:S.name,goal:50000,open:0,items:[],tx:[]};save();render()}">Start fresh</button></div>`}
function list(){const c=["All","Clothes","Technologies","Food","Shoes","Other"],L=S.items.filter(i=>(fCat==="All"||i.cat===fCat)&&i.name.toLowerCase().includes(q)).sort((a,b)=>PR[a.pri]-PR[b.pri]||a.due.localeCompare(b.due));
return hdr(`<button class="ib" onclick="go('add')">${ic("plus",18)}</button>`)+`<h1>Your shopping list</h1><div class="sub">Make room for the things that matter.</div><div style="position:relative;margin-top:14px"><span style="position:absolute;left:12px;top:13px;color:var(--mut)">${ic("search",18)}</span><input placeholder="Find an item" value="${esc(q)}" style="padding-left:40px" oninput="q=this.value.toLowerCase();sub()"></div><div class="chips">${c.map(x=>`<button class="${x===fCat?"on":""}" onclick="fCat='${x}';render()">${x==="All"?"All · "+S.items.length:x}</button>`).join("")}</div>
<div class="soft" style="padding:12px;display:flex;gap:10px;align-items:center;color:var(--g)">${ic("wallet",18)}<div><b>${m(sp())} spendable</b><div class="meta">${m(res())} savings kept aside</div></div></div><div class="row meta" style="margin:10px 2px"><span>${L.length} planned items</span><span>${ic("sort",14)} Priority first</span></div><div id="items">${L.map(itemCard).join("")||'<div class="note">No items yet.</div>'}</div>`+`<div class="note">Sample price ranges · ${sh(today())}<br>Enter prices you see in shops or on Jiji.mw. Each item is compared with your current spendable money, not the whole life.</div><button class="btn d" onclick="go('add')">${ic("plus",16)}Add shopping item</button>`.replace("whole life","whole fund")}
function sub(){const L=S.items.filter(i=>(fCat==="All"||i.cat===fCat)&&i.name.toLowerCase().includes(q));$("items").innerHTML=L.map(itemCard).join("")}
function detail(){const i=S.items.find(x=>x.id===V.id);if(!i)return go('list'),"";const s=st(i),b=sp(),p=Math.max(0,Math.min(1,(b-i.min)/(i.max-i.min))),T=s[1]==="g"?["Full range affordable",`Even at the top of the range you’d have ${m(b-i.max)} left.`]:s[1]==="a"?["Budget within range",`Lower-priced options fit. At the top of the range, you’d need ${m(i.max-b)} more.`]:["Outside budget",`You’d need ${m(i.min-b)} more for the lowest price.`];
return hdr(`<button class="ib" onclick="editPrice(${i.id})">${ic("edit",16)}</button>`).replace('<div class="brand">',`<div class="brand" onclick="go('list')" style="cursor:pointer">${ic("back",18)}&nbsp;`)+`<h1>Item details</h1><div class="sub">A clearer picture before you buy.</div><div class="irow" style="margin:16px 0"><div class="ico" style="width:76px;height:76px;border-radius:18px">${ic(i.cat,32)}</div><div><div class="meta" style="font-weight:900;color:var(--g)">${i.cat}</div><div class="nm" style="font-size:22px">${esc(i.name)}</div><div class="meta" style="font-size:12px">${esc(i.sub||"")}</div></div></div>
<div class="card" style="cursor:default;padding:16px"><div class="row"><b style="color:var(--g)">Sample price range</b><span class="chip n">Illustrative</span></div><div class="big" style="font-size:22px;margin:12px 0 20px">${m(i.min)}–${i.max.toLocaleString("en-US")}</div><div style="position:relative;height:8px;background:#f1e6cf;border-radius:9px"><div style="width:${p*100}%;height:100%;background:#1f4d3f;border-radius:9px"></div><div style="position:absolute;left:${p*100}%;top:-26px;transform:translateX(-${p*100}%);text-align:center;font-size:10px;font-weight:900;color:var(--g);white-space:nowrap">Your budget<br>${m(b)}</div></div><div class="row meta" style="margin:8px 0 14px"><span>${m(i.min)}</span><span>${m(i.max)}</span></div>
<div class="chip ${s[1]}" style="display:block;padding:12px;border-radius:12px;font-weight:700;font-size:13px"><b>${T[0]}</b><br>${T[1]}</div><div class="meta" style="margin-top:12px">Source: your own estimate · Not verified</div></div>
<h2 style="color:var(--g);margin:20px 0 4px">Your plan</h2><div class="meta">Priority</div><div class="seg">${["High","Medium","Low"].map(x=>`<button class="${x===i.pri?"on":""}" onclick="setP(${i.id},'${x}')">${x}</button>`).join("")}</div>
<select onchange="setW(${i.id},this.value)">${TF.map(x=>`<option ${x===i.when?"selected":""}>${x}</option>`).join("")}</select><div class="meta" style="margin:-4px 2px 12px">Target date: ${lg(i.due)}</div>
<div style="color:var(--g);font-weight:900;display:flex;gap:6px;align-items:center">${ic("shield",16)}Your ${m(res())} savings stay aside.</div><div class="meta" style="margin:4px 0 14px">Compared with ${m(b)} spendable. Check the final price with the seller before purchasing.</div><button class="btn d" onclick="openRec('expense',${i.id})">${ic("check",16)}Record a purchase</button><div style="text-align:center;margin-top:12px"><button class="lk" onclick="if(confirm('Remove this item?')){S.items=S.items.filter(x=>x.id!==${i.id});save();go('list')}">Remove item</button></div>`}
const setP=(id,p)=>{S.items.find(x=>x.id===id).pri=p;save();render()},setW=(id,w)=>{const i=S.items.find(x=>x.id===id);i.when=w;i.due=dueOf(w);save();render()};
function editPrice(id){const i=S.items.find(x=>x.id===id),v=prompt("Price range in MWK, e.g. 18000-22000",i.min+"-"+i.max);if(!v)return;const [a,b]=v.replace(/[, ]/g,"").split("-").map(Number);if(a>0&&b>=a){i.min=a;i.max=b;save();render()}}

function addItem(){const n=$("in").value.trim(),a=+$("imn").value,b=+$("imx").value||a;if(!n)return alert("Please enter an item name.");const w=$("iw").value;S.items.push({id:Date.now(),name:n,sub:$("is").value.trim(),cat:$("ic").value,pri:$("ip").value,when:w,due:dueOf(w),min:Math.min(a,b),max:Math.max(a,b)});save();go('list')}
function money(){const mo=today().slice(0,7),inM=x=>x.date.slice(0,7)===mo,by=p=>sum("saving",x=>x.method===p),sv=S.tx.filter(x=>x.type==="saving").sort((a,b)=>b.date.localeCompare(a.date)),pct=Math.min(100,res()/S.goal*100);
return hdr(`<button class="ib" onclick="openRec('saving')">${ic("plus",18)}</button>`)+`<h1>Your money</h1><div class="sub">Every kwacha, with a purpose.</div>`+hero()+`<div class="row meta" style="font-weight:900;color:var(--g);margin-bottom:8px"><span>${ML[new Date().getMonth()]} so far</span><span>1–${new Date().getDate()} ${MON[new Date().getMonth()]}</span></div><div class="btns"><div class="card" style="cursor:default"><span class="meta">${ic("inc",12)} Income</span><div class="nm">${m(sum("income",inM))}</div></div><div class="card" style="cursor:default"><span class="meta">${ic("exp",12)} Expenses</span><div class="nm">${m(sum("expense",inM))}</div></div></div>
<div class="soft"><div class="row"><span style="font-size:13px;color:var(--g)">Rainy-day fund<br><span class="big">${m(res())}</span></span>${ic("sprout",24)}</div><div class="row meta"><span>Goal: ${m(S.goal)}</span><b>${Math.round(pct)}%</b></div><div class="bar"><i style="width:${pct}%"></i></div>${["Airtel Money","TNM Mpamba"].map(p=>`<div class="row" style="margin-top:10px"><span class="irow nm"><span class="lt2" style="background:#fffefb">${p[0]}</span>${p}</span><b>${m(by(p))}</b></div>`).join("")}<div class="meta" style="margin-top:12px">Manually recorded allocations. Accounts are not linked or synced.</div></div>
<div class="note" style="display:flex;gap:6px">${ic("info"in P?"info":"shield",14)}Savings are reserved, not an extra expense. Transfers reduce spendable money; total funds stay the same.</div><div class="sec"><h2>Daily savings</h2><a onclick="go('hist')">View history →</a></div><div class="row meta" style="font-size:13px"><span>Saved today</span><b class="big" style="font-size:18px">${m(sum("saving",x=>x.date===today()))}</b></div><div style="margin:8px 0 14px">${sv.slice(0,3).map(txRow).join("")||'<div class="note">No savings recorded yet.</div>'}</div><button class="btn d" onclick="openRec('saving')">${ic("plus",16)}Add daily savings</button>`}
function hist(){const mo=hm,inM=x=>x.date.slice(0,7)===mo,L=S.tx.filter(inM).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id),c=t=>L.filter(x=>x.type===t).length,F=[["All","All",L.length],["income","Income",c("income")],["expense","Expenses",c("expense")],["saving","Savings",c("saving")]],V2=L.filter(x=>fTx==="All"||x.type===fTx),[y,mm]=mo.split("-").map(Number),end=mo+"-31";
return hdr(`<button class="ib" onclick="exportCsv()">${ic("dl",16)}</button>`)+`<h1>Your money trail</h1><div class="sub">Every entry, all in one place.</div><div class="card row" style="cursor:default;margin-top:14px;font-weight:900;color:var(--g)"><span onclick="shM(-1)" style="cursor:pointer">${ic("left",18)}</span><span>${ic("cal",16)} ${ML[mm-1]} ${y}</span><span onclick="shM(1)" style="cursor:pointer">${ic("chev",18)}</span></div>

<div class="seg" style="font-size:12px">${F.map(f=>`<button class="${f[0]===fTx?"on":""}" onclick="fTx='${f[0]}';render()">${f[1]} · ${f[2]}</button>`).join("")}</div><div class="meta" style="margin:6px 2px">${fTx==="All"?"All":F.find(f=>f[0]===fTx)[1]} · ${V2.length} transactions · Newest first</div><div>${V2.map(txRow).join("")||'<div class="note">Nothing recorded this month.</div>'}</div>
<div class="soft row meta" style="padding:12px;color:var(--g);font-weight:900"><span>Opening balance · 1 ${MON[mm-1]}</span><span>${m(S.open)}</span></div><div class="row" style="font-weight:900;color:var(--g)"><span>Reserved in ${c("saving")} savings transfers</span><span>${m(sum("saving",inM))}</span></div><div class="note">Savings stay within total funds, not expenses. ${m(funds())} − ${m(res())} reserved = ${m(sp())} spendable.</div><button class="btn d" onclick="openRec('saving')">${ic("plus",16)}Record a transaction</button><div class="note" style="text-align:center;margin-top:12px">Tap an entry to delete it · Manually recorded, not synced</div>`}
function shM(n){const[y,mo]=hm.split("-").map(Number),d=new Date(y,mo-1+n,1);hm=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render()}
function exportCsv(){const r=["date,type,amount,method,note",...S.tx.map(x=>[x.date,x.type,x.amt,x.method,'"'+x.note+'"'].join(","))].join("\n");const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(r);a.download="pangono.csv";a.click()}
function delTx(id){if(confirm("Delete this record?")){S.tx=S.tx.filter(x=>x.id!==id);save();render()}}

function rec(){const T=[["income","Income","inc"],["expense","Expense","exp"],["saving","Savings","coin"]],M=D.type==="saving"?["Airtel Money","TNM Mpamba"]:["Airtel Money","TNM Mpamba","Cash","Bank"];
return hdr(`<button class="ib" onclick="go('${D.item?"detail":"money"}',{id:D.item})">${ic("x",16)}</button>`).replace('<div class="brand">',`<div class="brand" onclick="history.length&&go('money')" style="cursor:pointer">${ic("back",18)}&nbsp;`)+`<h1>Record transaction</h1><div class="sub">Keep a simple record of your money.</div><div class="seg">${T.map(t=>`<button class="${D.type===t[0]?"on d":""}" onclick="setT('${t[0]}')">${ic(t[2],14)}${t[1]}</button>`).join("")}</div>
<div class="card" style="cursor:default;padding:16px"><div class="row meta"><span>${D.type==="saving"?"Amount to save":D.type==="income"?"Amount received":"Amount spent"}</span><span class="chip n">Draft</span></div><div class="amt" style="margin:8px 0"><span>MWK</span><input id="ra" type="number" inputmode="numeric" value="${D.amt}" placeholder="0" oninput="upd()"></div><div class="meta">Available to allocate: ${m(sp())}</div></div>
<label>${D.type==="saving"?"Where are you saving?":"Method"}</label><div class="mg">${M.map(x=>`<div class="mc ${D.method===x?"on":""}" onclick="setM('${x}')"><span class="lt2">${x[0]}</span>${x}</div>`).join("")}</div><div class="meta" style="margin-bottom:12px">For your records only. No money is moved and no account is connected.</div>
<label>Date</label><input id="rd" type="date" value="${D.date}"><label>Note <span class="meta" style="float:right">Optional</span></label><input id="rn" value="${esc(D.note)}" placeholder="A little more for a rainy day"><div class="soft" id="rs">${sumry()}</div><button class="btn d" id="rb" onclick="submit()">${ic("check",16)} Record ${m(+D.amt||0)} ${D.type==="saving"?"savings":D.type}</button><div class="note" style="text-align:center">Preview only until you tap record</div>`}
function submit(){sync();const a=+D.amt;if(!(a>0))return alert("Please enter an amount.");if(D.type!=="income"&&a>sp()&&!confirm("This is more than your spendable money. Record anyway?"))return;S.tx.push({id:Date.now(),type:D.type,amt:a,date:D.date||today(),method:D.method,note:D.note.trim()});if(D.item){S.items=S.items.filter(x=>x.id!==D.item)}save();hm=(D.date||today()).slice(0,7);fTx="All";D=null;go(V.t==="rec"?"hist":"home")}
